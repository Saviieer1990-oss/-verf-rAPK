name: Android APK build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Packa upp patch.zip om den finns
        run: |
          if [ -f patch.zip ]; then
            unzip -o patch.zip -d .
            rm patch.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Lägg in projektfiler från patch.zip"
            git push
          else
            echo "Ingen patch.zip, bygger det som finns."
          fi

      - name: Kontrollera att projektet finns
        id: check
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Inga projektfiler än. Ladda upp patch.zip."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.check.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        if: steps.check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        if: steps.check.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK as workflow artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OverforAPK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Work out release version
        id: version
        if: steps.check.outputs.ready == 'true'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.check.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.check.outputs.sha }}
          name: ÖverförAPK ${{ steps.version.outputs.tag }}
          body: |
            Testversion av ÖverförAPK.

            APK-filen kan laddas ner under Assets nedan. TV-kompatibilitet behöver verifieras på fysisk enhet.
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
